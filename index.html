<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17463a">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Plateforme de gestion scolaire : calcul des moyennes, bulletins et suivi des résultats des élèves.">
<title>Klasora — Gestion scolaire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317463a'/%3E%3Cpath d='M20 14v36M20 33l22-19M26 28l18 22' stroke='%23f2b705' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>:root{
  --chalk:#17463a; --chalk-2:#0f332a; --paper:#f3f5f7; --card:#fff; --ink:#17212b; --muted:#5d6b78;
  --line:#dde3e8; --pencil:#f2b705; --red:#c8372d; --ok:#1b7a4f; --blue:#2c5fa8;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#11181d; --card:#1a232a; --ink:#e8edf0; --muted:#9aa8b3; --line:#2c3943; --chalk:#0f332a; --chalk-2:#0a241d}
}
*{box-sizing:border-box}
html{font-family:var(--f-body);color:var(--ink);background:var(--paper);font-size:16px}
body{margin:0;min-height:100vh}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--chalk);color:#e9f1ee;padding:22px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center}
.brand .mark{width:42px;height:42px;border-radius:12px;background:var(--pencil);color:var(--chalk-2);display:grid;place-items:center;font:700 24px var(--f-display)}
.brand strong{font:700 20px var(--f-display);display:block}
.brand small{opacity:.75;font-size:13px;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav{display:flex;flex-direction:column;gap:4px}
#nav button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600}
#nav button:hover{background:rgba(255,255,255,.08)}
#nav button[aria-current=page]{background:#fff;color:var(--chalk-2)}
.side-note{margin-top:auto;font-size:13px;opacity:.7;line-height:1.4}
main{padding:28px 32px 60px;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.head h1{font-size:30px}
.head p{margin:4px 0 0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.bar label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
button.primary,button.ghost,button.danger{border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:40px;border:1px solid transparent}
button.primary{background:var(--chalk);color:#fff}
button.primary:hover{background:var(--chalk-2)}
button.ghost{background:var(--card);border-color:var(--line)}
button.ghost:hover{border-color:var(--muted)}
button.danger{background:none;color:var(--red);border-color:var(--line)}
button.mini{min-height:32px;padding:4px 10px;font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px}
.panel>h2{font-size:18px;padding:14px 18px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:14px;color:var(--muted);font-weight:600;background:color-mix(in srgb,var(--paper) 60%,var(--card))}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.acts{text-align:right}
td.acts button{margin-left:6px}
.low{color:var(--red);font-weight:600}
.good{color:var(--ok);font-weight:600}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:700 18px var(--f-display);margin-bottom:6px}
.empty .row{justify-content:center;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat b{font:700 30px var(--f-display);display:block}
.stat span{color:var(--muted);font-size:14px}
.stat.hero{background:var(--chalk);color:#fff;border-color:var(--chalk)}
.stat.hero span{color:#cfe0da}
.stat.hero b{color:var(--pencil)}
.grade{width:76px;text-align:right;font-variant-numeric:tabular-nums}
.grade.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--card))}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.pill.ko{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
form.set{padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
form.set label,.dform label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
form.set .full{grid-column:1/-1}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(440px,92vw)}
dialog::backdrop{background:rgba(10,20,25,.55)}
.dform{padding:20px;display:flex;flex-direction:column;gap:14px}
.dform h3{font-size:20px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}
.bars{padding:16px 18px;display:grid;gap:10px}
.bars div{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:14px}
.bars i{display:block;height:14px;border-radius:4px;background:var(--chalk)}
.bars i.red{background:var(--red)}
.bars .track{background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:4px}

/* Bulletin */
#print-area{display:none}
.sheet{background:#fff;color:#111;font-family:var(--f-body);padding:14mm 12mm;width:210mm;min-height:297mm;margin:0 auto;page-break-after:always}
.sheet:last-child{page-break-after:auto}
.sheet header{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #17463a;padding-bottom:10px;margin-bottom:14px}
.sheet h1{font-size:22px;color:#17463a}
.sheet .meta{font-size:13px;line-height:1.5}
.sheet h2{font-size:17px;text-align:center;margin:6px 0 12px;text-transform:uppercase;letter-spacing:.04em}
.sheet .who{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:14px;margin-bottom:12px}
.sheet table{font-size:13px}
.sheet th,.sheet td{border:1px solid #9aa5ad;padding:5px 7px;color:#111;background:none}
.sheet th{background:#e8efec;font-weight:600}
.sheet .red{color:#c8372d;font-weight:700}
.sheet .total td{font-weight:700;background:#f2f5f4}
.sheet .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.sheet .sum div{border:2px solid #17463a;border-radius:8px;padding:8px;text-align:center;font-size:13px}
.sheet .sum b{display:block;font:700 20px var(--f-display);color:#17463a}
.sheet .obs{border:1px solid #9aa5ad;min-height:60px;padding:8px;font-size:13px;margin-bottom:14px}
.sheet .sign{display:flex;justify-content:space-between;font-size:13px;margin-top:20px}
.sheet.land{width:297mm;min-height:210mm;page:land}
.sheet.land table{font-size:10.5px}
.sheet.land th,.sheet.land td{padding:3px 4px}
.sheet td.l{text-align:left}
.sheet table.notes td,.sheet table.notes th{text-align:center}
.sheet table.notes td:first-child{text-align:left}
.sheet .sum.two{grid-template-columns:repeat(2,1fr)}
.sheet .rt{font-size:15px;margin:14px 0 6px;color:#17463a}
.sheet table.recap td,.sheet table.recap th{text-align:center}
.sheet table.recap td.l{text-align:left}
@page land{size:A4 landscape;margin:0}
.preview-wrap{background:color-mix(in srgb,var(--line) 60%,var(--paper));padding:14px;border-radius:12px;overflow-x:auto}
.preview-wrap .sheet{box-shadow:0 2px 12px rgba(0,0,0,.15);min-height:0;margin:0 auto 14px}

@media (max-width:820px){
  .preview-wrap .sheet{zoom:.45}
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:12px 14px;gap:10px}
  .side-note{display:none}
  #nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  #nav button{white-space:nowrap}
  main{padding:18px 14px 50px}
  .head h1{font-size:24px}
}
@media print{
  @page{size:A4;margin:0}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .sheet{box-shadow:none;margin:0;width:auto}
  html,body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#export-area{position:fixed;left:-10000px;top:0;display:block}
#export-area .sheet{margin:0;box-shadow:none}

/* ===== Interface dynamique : fond moderne, verre dépoli, animations ===== */
:root{--bg1:#eaf1ee;--glass:color-mix(in srgb,var(--card) 80%,transparent);--glass-line:color-mix(in srgb,var(--line) 70%,#fff 30%);--shadow:0 10px 30px rgba(15,51,42,.08)}
@media (prefers-color-scheme:dark){:root{--bg1:#0b1316;--glass:color-mix(in srgb,var(--card) 72%,transparent);--shadow:0 10px 30px rgba(0,0,0,.35)}}
html{background:var(--bg1)}
body{background:transparent}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg1)}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;will-change:transform;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){width:52vmax;height:52vmax;background:#3fb88a;left:-14vmax;top:-18vmax}
.bg i:nth-child(2){width:40vmax;height:40vmax;background:#f6c945;right:-10vmax;top:8vh;animation-duration:30s;animation-delay:-8s}
.bg i:nth-child(3){width:48vmax;height:48vmax;background:#6a9be0;left:28vw;bottom:-26vmax;animation-duration:36s;animation-delay:-14s}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(23,70,58,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(23,70,58,.07) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 30% 20%,#000 0,transparent 75%);mask-image:radial-gradient(ellipse at 30% 20%,#000 0,transparent 75%)}
@media (prefers-color-scheme:dark){.bg i{opacity:.22}.bg::after{background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px)}}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vmax,4vmax,0) scale(1.08)}100%{transform:translate3d(-4vmax,8vmax,0) scale(.95)}}
.shell{position:relative;z-index:0}
.side{background:linear-gradient(180deg,var(--chalk) 0%,var(--chalk-2) 100%);box-shadow:6px 0 30px rgba(15,51,42,.18)}
#nav button{display:flex;align-items:center;gap:11px;transition:background .2s,transform .2s}
#nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#nav button:hover{transform:translateX(3px)}
#nav button[aria-current=page]{box-shadow:0 6px 16px rgba(0,0,0,.2)}
.panel,.stat,dialog{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border-color:var(--glass-line);box-shadow:var(--shadow)}
.stat,.panel{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.stat:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(15,51,42,.14)}
.stat.hero-stat{background:linear-gradient(135deg,var(--chalk),#1f7a60);color:#fff;border-color:transparent}
.stat.hero-stat span{color:#d4e7e0}
.stat.hero-stat b{color:var(--pencil)}
.stat b{font-variant-numeric:tabular-nums}
button.primary,button.ghost{transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
button.primary:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(23,70,58,.28)}
button.ghost:hover{transform:translateY(-1px)}
button:active{transform:scale(.97)!important}
tbody tr{transition:background .15s}
tbody tr:hover{background:color-mix(in srgb,var(--chalk) 7%,transparent)}
th{background:color-mix(in srgb,var(--card) 55%,transparent)}
.head h2{font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px}
.grid2 .panel{margin-bottom:0}

/* Hero du tableau de bord */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;padding:28px;border-radius:20px;color:#fff;position:relative;overflow:hidden;margin-bottom:26px;background:linear-gradient(120deg,#0f332a 0%,#17604b 55%,#2a8f6c 100%);box-shadow:0 18px 40px rgba(15,51,42,.28)}
.hero::before{content:"";position:absolute;width:340px;height:340px;right:-90px;top:-130px;border-radius:50%;background:radial-gradient(circle,rgba(242,183,5,.55),transparent 68%);animation:pulse 7s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.5px);background-size:22px 22px;opacity:.5;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:32px;line-height:1.15;margin:6px 0 8px}
.hero p{margin:0 0 18px;color:#d4e7e0;max-width:46ch}
.eyebrow{display:block;text-transform:capitalize;font-size:14px;opacity:.85;letter-spacing:.02em}
.on-dark.primary{background:var(--pencil);color:#0f332a}
.on-dark.primary:hover{background:#ffcb1f}
.on-dark.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.on-dark.ghost:hover{background:rgba(255,255,255,.2)}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(1.25);opacity:1}}
.steps{display:grid;gap:8px}
.step{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;transition:background .2s,transform .2s}
.step:hover{background:rgba(255,255,255,.2);transform:translateX(4px)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;flex:none;transition:.3s}
.tick svg{width:16px;height:16px;fill:none;stroke:#0f332a;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;stroke-dasharray:20;stroke-dashoffset:20}
.step.done .tick{background:var(--pencil);border-color:var(--pencil)}
.step.done .tick svg{opacity:1;animation:draw .5s .35s ease forwards}
.step.done{background:rgba(255,255,255,.16)}
@keyframes draw{to{stroke-dashoffset:0}}

/* Anneau de taux de réussite et barres animées */
.ringstat{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ring{position:relative;width:74px;height:74px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .rg-bg{stroke:color-mix(in srgb,var(--line) 80%,transparent)}
.ring .rg{stroke:var(--ok);stroke-linecap:round;animation:ring 1.2s cubic-bezier(.2,.8,.2,1) both}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 16px var(--f-display)}
.ringstat .ring b{font-size:15px}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.bars i{transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}

/* Apparition en cascade à chaque changement d'écran */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
main.enter>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.07s}
main.enter>*:nth-child(3){animation-delay:.14s}
main.enter>*:nth-child(4){animation-delay:.21s}
main.enter>*:nth-child(5){animation-delay:.28s}
main.enter>*:nth-child(6){animation-delay:.35s}
main.enter>*:nth-child(7){animation-delay:.42s}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:22px}
  .hero h1{font-size:26px}
  .grid2{grid-template-columns:1fr}
  #nav button:hover{transform:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.stat b span{font-size:inherit;color:inherit}
.eyebrow{text-transform:none}
.eyebrow::first-letter{text-transform:uppercase}
main,.hero>*{min-width:0}
.hero h1{overflow-wrap:anywhere}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:minmax(0,1fr)}}
.stat b span,.stat.hero-stat b span{color:inherit}
@media (prefers-color-scheme:dark){.bars i{background:#3fb88a}.bars i.red{background:#e0584d}}

/* ===== Accès, notifications, administrateur ===== */
[hidden]{display:none!important}
body.locked .shell{display:none}
body.k-noscroll{overflow:hidden}
.ava{width:38px;height:38px;border-radius:50%;background:var(--pencil);color:var(--chalk-2);display:grid;place-items:center;font:700 17px var(--f-display);flex:none}
.ava.sm{width:34px;height:34px;font-size:15px}
.k-glass{background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 22px 60px rgba(8,30,24,.22)}
.k-auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto;z-index:30}
.k-card{width:min(460px,100%);border-radius:20px;padding:26px 26px 22px}
.k-auth.fresh .k-card{animation:kCard .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes kCard{from{opacity:0;transform:translateY(20px) scale(.97)}}
.k-center{text-align:center}
.k-center h2{font-size:24px;margin:8px 0 6px}
.k-brand{display:flex;gap:12px;align-items:center}
.k-brand .mark{width:44px;height:44px;border-radius:12px;background:var(--chalk);color:var(--pencil);display:grid;place-items:center;font:700 24px var(--f-display)}
.k-brand strong{font:700 21px var(--f-display);display:block}
.k-brand small{color:var(--muted)}
.k-mode{display:flex;gap:10px;margin-top:14px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--pencil) 20%,transparent);font-size:13.5px;line-height:1.4}
.k-mode svg{flex:none;margin-top:2px}
.k-seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:color-mix(in srgb,var(--line) 55%,transparent);border-radius:12px;padding:4px;margin:16px 0 12px}
.k-seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--card);border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.14);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.k-seg[data-pos="1"] i{transform:translateX(100%)}
.k-seg button{position:relative;z-index:1;background:none;border:0;padding:10px;font-weight:600;cursor:pointer;color:var(--muted);transition:color .2s}
.k-seg button[aria-selected=true]{color:var(--ink)}
.k-lead{color:var(--muted);margin:0 0 14px;line-height:1.45}
.k-lead.small{font-size:14px;margin:10px 0 0}
.k-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.k-chips button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-size:14px;font-weight:600;transition:transform .15s,border-color .2s,background .2s}
.k-chips button:hover{transform:translateY(-2px);border-color:var(--muted)}

<script>(() => {

/* ---------- Données ---------- */
let KEY = 'klasora-none';

/* ---------- Calculs pédagogiques ---------- */
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const r2 = x => x == null ? null : Math.round(x * 100) / 100;

const mean = a => a.length ? a.reduce((p, c) => p + c, 0) / a.length : null;

/* Classes du primaire (CP1, CP2, CE1, CE2, CM1, CM2) : pas de devoirs, seule la composition du trimestre compte. */
const PRIMARY_RE = /(^|[^a-z])(CP|CE|CM)\s*[-_.]?\s*[12](?![0-9])/i;

function termAvg(g, primary) {

  const subs = S.subjects.filter(s => s.classId === classId);

    let tot = 0, coefs = 0;
    const lines = subs.map(sub => {

  });
  const avgs = rows.map(r => r.avg).filter(x => x !== null);
  const subjMeans = {};
  subs.forEach(sub => { subjMeans[sub.id] = mean(rows.map(r => r.lines.find(l => l.sub.id === sub.id).m).filter(x => x !== null)); });

    ensureClass();
    const t = ui.term;
    const rows = S.classes.map(c => { const r = classResults(c.id, t); const top = r.rows.filter(x => x.rank === 1)[0]; return { c, r, top, n: r.rows.length }; });
    const all = rows.flatMap(x => x.r.rows.filter(y => y.avg != null));
    const global = mean(all.map(y => y.avg));
    const pct = all.length ? all.filter(y => y.avg >= 10).length / all.length : null;
    const weak = rows.flatMap(x => x.r.rows.filter(y => y.avg != null && y.avg < 8).map(y => ({ ...y, cn: x.c.name }))).sort((a, b) => a.avg - b.avg).slice(0, 8);
    const hr = new Date().getHours(), hello = hr >= 5 && hr < 18 ? 'Bonjour' : 'Bonsoir';
    const nGrades = Object.values(S.grades).reduce((n, g) => n + Object.values(g).reduce((m, sg) => m + Object.values(sg).reduce((k, tg) => k + ['d1', 'd2', 'c'].filter(f => num(tg[f]) !== null).length, 0), 0), 0);
    const steps = [['Créer une classe', S.classes.length > 0, 'classes'], ['Définir les matières', S.subjects.length > 0, 'subjects'], ['Inscrire les élèves', S.students.length > 0, 'students'], ['Saisir des notes', nGrades > 0, 'grades'], ['Éditer les bulletins', all.length > 0, 'bulletins']];
    const done = steps.filter(x => x[1]).length;
    const buckets = [0, 0, 0, 0]; all.forEach(y => buckets[Math.min(3, Math.floor(y.avg / 5))]++);
    const bmax = Math.max(1, ...buckets);
    const cnt = (v, dec = 0) => v == null ? '–' : `<span data-count="${v}" data-dec="${dec}">${dec ? fmt(v) : v}</span>`;
    return `<section class="hero">
        <div class="hero-t"><span class="eyebrow" data-clock></span><h1>${hello}, ${esc(S.school.name)}</h1><p>Année scolaire ${esc(S.school.year)}. ${done === 5 ? 'Tout est en place : suivez vos résultats en temps réel.' : 'Suivez ces étapes pour préparer vos premiers bulletins.'}</p>
          <div class="row"><button class="primary on-dark" data-a="nav" data-v="grades">Saisir des notes</button><button class="ghost on-dark" data-a="nav" data-v="bulletins">Éditer les bulletins</button></div></div>
        <div class="hero-r"><div class="steps">${steps.map(([l, ok, v], i) => `<button class="step ${ok ? 'done' : ''}" data-a="nav" data-v="${v}" style="--i:${i}"><span class="tick"><svg viewBox="0 0 20 20"><path d="M5 10.5l3.2 3.2L15 6.8"/></svg></span>${l}</button>`).join('')}</div></div>
      </section>
      <div class="head"><h2>Vue d’ensemble — ${termLabel(t)}</h2><div class="bar">${termSelect(true)}</div></div>
      <div class="stats">
        <div class="stat hero-stat"><b>${cnt(global, 2)}</b><span>Moyenne générale de l’établissement</span></div>
        <div class="stat"><b>${cnt(S.classes.length)}</b><span>Classes</span></div>
        <div class="stat"><b>${cnt(S.students.length)}</b><span>Élèves</span></div>
        <div class="stat ringstat">${ring(pct)}<span>Élèves ayant 10 ou plus</span></div>
      </div>
      ${S.classes.length ? `
      <div class="grid2">
        <div class="panel"><h2>Moyenne par classe</h2>
          <div class="bars">${rows.map(x => `<div><span>${esc(x.c.name)}</span><span class="track"><i class="${x.r.classAvg != null && x.r.classAvg < 10 ? 'red' : ''}" style="width:${Math.min(100, (x.r.classAvg || 0) / 20 * 100)}%;display:block"></i></span><b>${fmt(x.r.classAvg)}</b></div>`).join('')}</div></div>
        <div class="panel"><h2>Répartition des moyennes</h2>
          <div class="bars">${['0 – 5', '5 – 10', '10 – 15', '15 – 20'].map((l, i) => `<div><span>${l}</span><span class="track"><i class="${i < 2 ? 'red' : ''}" style="width:${buckets[i] / bmax * 100}%;display:block"></i></span><b>${buckets[i]}</b></div>`).join('')}</div></div>
      </div>
      <div class="panel"><h2>Résultats par classe</h2><div class="scroll"><table>
        <thead><tr><th>Classe</th><th class="n">Effectif</th><th class="n">Moyenne</th><th class="n">Taux de réussite</th><th>Premier(ère)</th></tr></thead>
        <tbody>${rows.map(x => `<tr><td>${esc(x.c.name)}</td><td class="n">${x.n}</td><td class="${cls(x.r.classAvg)}">${fmt(x.r.classAvg)}</td><td class="n">${x.r.success == null ? '–' : Math.round(x.r.success * 100) + ' %'}</td><td>${x.top ? esc(x.top.st.nom + ' ' + x.top.st.prenom) + ' (' + fmt(x.top.avg) + ')' : '–'}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="panel"><h2>Élèves à suivre (moyenne sous 8)</h2>${weak.length ? `<div class="scroll"><table><thead><tr><th>Élève</th><th>Classe</th><th class="n">Moyenne</th></tr></thead><tbody>${weak.map(w => `<tr><td>${esc(w.st.nom + ' ' + w.st.prenom)}</td><td>${esc(w.cn)}</td><td class="n low">${fmt(w.avg)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Aucun élève sous 8 sur cette période.</div>`}</div>`
      : needClass('Créez ensuite les matières, ajoutez les élèves et saisissez les notes.')}`;
  },

  classes() {
    return `<div class="head"><div><h1>Classes</h1><p>Chaque classe a ses propres matières, coefficients et élèves.</p></div><button class="primary" data-a="addClass">Ajouter une classe</button></div>
    <div class="panel">${S.classes.length ? `<div class="scroll"><table><thead><tr><th>Nom</th><th>Cycle</th><th class="n">Élèves</th><th class="n">Matières</th><th></th></tr></thead><tbody>${S.classes.map(c => `<tr><td>${esc(c.name)}</td><td>${isPrimary(c) ? 'Primaire' : 'Secondaire'}</td><td class="n">${S.students.filter(s => s.classId === c.id).length}</td><td class="n">${S.subjects.filter(s => s.classId === c.id).length}</td><td class="acts"><button class="ghost mini" data-a="editClass" data-id="${c.id}">Modifier</button><button class="danger mini" data-a="delClass" data-id="${c.id}">Supprimer</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><strong>Aucune classe</strong>Ajoutez votre première classe, par exemple « 6e A » ou « CM2 ».</div>`}</div>`;
  },

  students() {
    ensureClass();
    if (!S.classes.length) return `<div class="head"><h1>Élèves</h1></div>` + needClass('Une classe est nécessaire pour inscrire des élèves.');
    const list = S.students.filter(s => s.classId === ui.classId).sort((a, b) => (a.nom + a.prenom).localeCompare(b.nom + b.prenom, 'fr'));
    return `<div class="head"><div><h1>Élèves</h1><p>${list.length} élève(s) dans cette classe.</p></div>
      <div class="bar">${classSelect()}<button class="ghost" data-a="importCsv">Importer un CSV</button><button class="primary" data-a="addStudent">Ajouter un élève</button></div></div>
      <p class="hint">Format CSV : matricule ; nom ; prénom ; sexe (M ou F), une ligne par élève.</p>
      <div class="panel">${list.length ? `<div class="scroll"><table><thead><tr><th>Matricule</th><th>Nom</th><th>Prénom</th><th>Sexe</th><th></th></tr></thead><tbody>${list.map(s => `<tr><td>${esc(s.matricule)}</td><td>${esc(s.nom)}</td><td>${esc(s.prenom)}</td><td>${esc(s.sexe)}</td><td class="acts"><button class="ghost mini" data-a="editStudent" data-id="${s.id}">Modifier</button><button class="danger mini" data-a="delStudent" data-id="${s.id}">Supprimer</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><strong>Classe vide</strong>Ajoutez les élèves un par un ou importez un fichier CSV.</div>`}</div>`;
  },

  subjects() {
    ensureClass();
    if (!S.classes.length) return `<div class="head"><h1>Matières</h1></div>` + needClass('Une classe est nécessaire pour définir ses matières.');
    const list = S.subjects.filter(s => s.classId === ui.classId);
    return `<div class="head"><div><h1>Matières et coefficients</h1><p>Le coefficient pèse dans la moyenne générale.</p></div>
      <div class="bar">${classSelect()}<button class="primary" data-a="addSubject">Ajouter une matière</button></div></div>
      <div class="panel">${list.length ? `<div class="scroll"><table><thead><tr><th>Matière</th><th class="n">Coefficient</th><th></th></tr></thead><tbody>${list.map(s => `<tr><td>${esc(s.name)}</td><td class="n">${s.coef}</td><td class="acts"><button class="ghost mini" data-a="editSubject" data-id="${s.id}">Modifier</button><button class="danger mini" data-a="delSubject" data-id="${s.id}">Supprimer</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><strong>Aucune matière</strong>Ajoutez les matières de cette classe avec leur coefficient.<div class="row"><button class="ghost" data-a="copySubjects">Copier depuis une autre classe</button></div></div>`}</div>`;
  },

  grades() {
    ensureClass();
    if (!S.classes.length) return `<div class="head"><h1>Notes</h1></div>` + needClass('Créez une classe, ses matières et ses élèves avant de saisir des notes.');
    if (ui.term === 'A') ui.term = '1';
    const subs = S.subjects.filter(s => s.classId === ui.classId);
    if (!subs.find(s => s.id === ui.subjectId)) ui.subjectId = subs[0]?.id || '';
    const studs = S.students.filter(s => s.classId === ui.classId).sort((a, b) => (a.nom + a.prenom).localeCompare(b.nom + b.prenom, 'fr'));
    const head = `<div class="head"><div><h1>Saisie des notes</h1><p>Notes sur 20. L’enregistrement est automatique.</p></div>
      <div class="bar">${classSelect()}${termSelect(false)}<label>Matière<select data-bind="subjectId">${subs.map(s => `<option value="${s.id}" ${ui.subjectId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label></div></div>`;
    if (!subs.length || !studs.length) return head + `<div class="panel"><div class="empty"><strong>${!subs.length ? 'Cette classe n’a pas de matière' : 'Cette classe n’a pas d’élève'}</strong>Complétez-la avant de saisir des notes.</div></div>`;
    const prim = isPrimary(S.classes.find(c => c.id === ui.classId));
    const wd = +S.school.wDev, wc = +S.school.wCompo;
    const inp = (st, g, k, label) => `<input class="grade ${num(g[k]) !== null && (num(g[k]) < 0 || num(g[k]) > 20) ? 'bad' : ''}" type="number" inputmode="decimal" min="0" max="20" step="0.25" value="${g[k] ?? ''}" data-g="${st.id}|${k}" aria-label="${esc(label + ' de ' + st.nom + ' ' + st.prenom)}">`;
    if (prim) return head + `<div class="panel"><div class="scroll"><table><thead><tr><th>Élève</th><th class="n">Note de composition</th></tr></thead><tbody>${studs.map(st => {
      const g = ((S.grades[st.id] || {})[ui.subjectId] || {})[ui.term] || {};
      return `<tr><td>${esc(st.nom + ' ' + st.prenom)}</td><td class="n">${inp(st, g, 'c', 'Composition')}</td></tr>`;
    }).join('')}</tbody></table></div></div>
    <p class="hint">Classe du primaire : il n’y a pas de devoirs. Seule la note de composition de chaque trimestre est saisie, et elle devient la note de la matière.</p>`;
    return head + `<div class="panel"><div class="scroll"><table><thead><tr><th>Élève</th><th class="n">Devoir 1</th><th class="n">Devoir 2</th><th class="n">Composition</th><th class="n">Moyenne</th></tr></thead><tbody>${studs.map(st => {
      const g = ((S.grades[st.id] || {})[ui.subjectId] || {})[ui.term] || {};
      const m = termAvg(g, false);
      return `<tr><td>${esc(st.nom + ' ' + st.prenom)}</td><td class="n">${inp(st, g, 'd1', 'Devoir 1')}</td><td class="n">${inp(st, g, 'd2', 'Devoir 2')}</td><td class="n">${inp(st, g, 'c', 'Composition')}</td><td class="${cls(m)}" data-m="${st.id}">${fmt(m)}</td></tr>`;
    }).join('')}</tbody></table></div></div>
    <p class="hint">Moyenne de la matière = (moyenne des devoirs × ${wd} + composition × ${wc}) ÷ ${wd + wc}. Réglable dans Paramètres.</p>`;
  },

  bulletins() {
    ensureClass();
    if (!S.classes.length) return `<div class="head"><h1>Bulletins</h1></div>` + needClass('Les bulletins se calculent à partir des notes saisies.');
    const R = classResults(ui.classId, ui.term);
    if (ui.preview) {
      const i = R.rows.findIndex(r => r.st.id === ui.preview);
      if (i >= 0) {
        const row = R.rows[i], prev = R.rows[i - 1], next = R.rows[i + 1];
        return `<div class="head"><div><h1>Aperçu du bulletin</h1><p>${esc(row.st.nom + ' ' + row.st.prenom)} — ${termLabel(ui.term)}</p></div>
          <div class="bar"><button class="ghost" data-a="closePreview">Retour au classement</button>${prev ? `<button class="ghost" data-a="preview" data-id="${prev.st.id}">Élève précédent</button>` : ''}${next ? `<button class="ghost" data-a="preview" data-id="${next.st.id}">Élève suivant</button>` : ''}<button class="ghost" data-a="comment" data-id="${row.st.id}">Observation</button><button class="primary" data-a="pdfOne" data-id="${row.st.id}">Télécharger le PDF</button><button class="ghost" data-a="printOne" data-id="${row.st.id}">Imprimer</button></div></div>
          <div class="preview-wrap">${sheetHTML(R, row, termsFor())}</div>`;
      }
      ui.preview = '';
    }
    const head = `<div class="head"><div><h1>Bulletins et classement</h1><p>${R.rows.length} élève(s) — moyenne de classe ${fmt(R.classAvg)}.</p></div>
      <div class="bar">${classSelect()}${termSelect(true)}<button class="primary" data-a="pdfAll">Télécharger tous (PDF)</button><button class="ghost" data-a="printAll">Imprimer tous</button><button class="ghost" data-a="csvResults">Résultats (CSV)</button></div></div>`;
    if (!R.rows.length || !R.subs.length) return head + `<div class="panel"><div class="empty"><strong>Rien à calculer</strong>Ajoutez des matières et des élèves, puis saisissez des notes.</div></div>`;
    const sorted = [...R.rows].sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999));
    return head + `<div class="stats">
      <div class="stat hero"><b>${fmt(R.classAvg)}</b><span>Moyenne de la classe</span></div>
      <div class="stat"><b>${fmt(R.max)}</b><span>Meilleure moyenne</span></div>
      <div class="stat"><b>${fmt(R.min)}</b><span>Plus faible moyenne</span></div>
      <div class="stat"><b>${R.success == null ? '–' : Math.round(R.success * 100) + ' %'}</b><span>Taux de réussite</span></div></div>
    <div class="panel"><h2>Classement — ${termLabel(ui.term)}</h2><div class="scroll"><table><thead><tr><th class="n">Rang</th><th>Élève</th><th class="n">Moyenne</th><th>Mention</th><th></th></tr></thead><tbody>${sorted.map(r => `<tr><td class="n">${r.rank ?? '–'}</td><td>${esc(r.st.nom + ' ' + r.st.prenom)}</td><td class="${cls(r.avg)}">${fmt(r.avg)}</td><td>${r.avg == null ? '' : `<span class="pill ${r.avg >= 10 ? 'ok' : 'ko'}">${mention(r.avg)}</span>`}</td><td class="acts"><button class="ghost mini" data-a="comment" data-id="${r.st.id}">Observation</button><button class="primary mini" data-a="preview" data-id="${r.st.id}">Voir le bulletin</button><button class="ghost mini" data-a="pdfOne" data-id="${r.st.id}">PDF</button></td></tr>`).join('')}</tbody></table></div></div>`;
  },

  settings() {
    const s = S.school;
    return `<div class="head"><div><h1>Paramètres</h1><p>Établissement, mode de calcul et sauvegarde.</p></div></div>
    <div class="panel"><h2>Établissement</h2><form class="set" data-form="settings">
      <label>Nom de l’établissement<input name="name" value="${esc(s.name)}" required></label>
      <label>Année scolaire<input name="year" value="${esc(s.year)}"></label>
      <label>Ville<input name="city" value="${esc(s.city)}"></label>
      <label>Chef d’établissement<input name="director" value="${esc(s.director)}"></label>
      <label>Poids des devoirs (hors primaire)<input name="wDev" type="number" min="0" step="0.5" value="${s.wDev}"></label>
      <label>Poids de la composition (hors primaire)<input name="wCompo" type="number" min="0" step="0.5" value="${s.wCompo}"></label>
      <div class="full row end"><button class="primary">Enregistrer</button></div></form></div>
    <div class="panel"><h2>Sauvegarde</h2><div class="set"><p class="hint full">Les données restent dans ce navigateur. Exportez régulièrement un fichier de sauvegarde, il permet aussi de passer d’un ordinateur à un autre.</p>
      <div class="full row"><button class="ghost" data-a="exportJson">Exporter la sauvegarde</button><button class="ghost" data-a="importJson">Importer une sauvegarde</button><button class="ghost" data-a="demo">Charger des données d’exemple</button><button class="danger" data-a="reset">Tout effacer</button></div></div></div>`;
  }
};

const NAV = [['dashboard', 'Tableau de bord'], ['classes', 'Classes'], ['students', 'Élèves'], ['subjects', 'Matières'], ['grades', 'Notes'], ['bulletins', 'Bulletins'], ['settings', 'Paramètres']];

const $$ = (q, r = document) => Array.from(r.querySelectorAll(q));
let lastKey = '';
function render(fresh) {
  $('#schoolName').textContent = S.school.name;
  $('#nav').innerHTML = NAV.map(([k, t]) => `<button data-a="nav" data-v="${k}" ${ui.view === k ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${t}</button>`).join('');
  const m = $('#main');
  m.innerHTML = views[ui.view]();
  if (fresh) { m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter'); }
  updateClock(); runCounters();
}

/* ---------- Bulletin imprimable ---------- */
const termsFor = () => ui.term === 'A' ? { 1: classResults(ui.classId, '1'), 2: classResults(ui.classId, '2'), 3: classResults(ui.classId, '3') } : null;
function sheetHTML(R, row, T) {
  const s = S.school, annual = ui.term === 'A';
  const c = S.classes.find(x => x.id === ui.classId);
  const nt = v => fmt(num(v));
  const prim = isPrimary(c);
  const lines = row.lines.map(l => {
    const g = (S.grades[row.st.id] || {})[l.sub.id] || {};
    const cells = prim
      ? (annual ? ['1', '2', '3'].map(t => `<td>${nt((g[t] || {}).c)}</td>`).join('') : `<td>${nt((g[ui.term] || {}).c)}</td>`)
      : annual
      ? ['1', '2', '3'].map(t => { const x = g[t] || {}, m = termAvg(g[t]); return `<td>${nt(x.d1)}</td><td>${nt(x.d2)}</td><td>${nt(x.c)}</td><td class="${m != null && m < 10 ? 'red' : ''}"><b>${fmt(m)}</b></td>`; }).join('')
      : (() => { const t = g[ui.term] || {}; return `<td>${nt(t.d1)}</td><td>${nt(t.d2)}</td><td>${nt(t.c)}</td>`; })();
    return `<tr><td class="l">${esc(l.sub.name)}</td>${cells}${prim && !annual ? '' : `<td class="${l.m != null && l.m < 10 ? 'red' : ''}"><b>${fmt(l.m)}</b></td>`}<td>${l.sub.coef}</td><td>${l.m == null ? '–' : fmt(l.m * l.sub.coef)}</td><td>${mention(l.m)}</td></tr>`;
  }).join('');
  const head = prim
    ? (annual
      ? `<tr><th>Matière</th><th>Compo. T1</th><th>Compo. T2</th><th>Compo. T3</th><th>Moy. annuelle</th><th>Coef.</th><th>Note × coef.</th><th>Appréciation</th></tr>`
      : `<tr><th>Matière</th><th>Composition</th><th>Coef.</th><th>Note × coef.</th><th>Appréciation</th></tr>`)
    : annual
    ? `<tr><th rowspan="2">Matière</th><th colspan="4">Trimestre 1</th><th colspan="4">Trimestre 2</th><th colspan="4">Trimestre 3</th><th rowspan="2">Moy. annuelle</th><th rowspan="2">Coef.</th><th rowspan="2">Moy. × coef.</th><th rowspan="2">Appréciation</th></tr><tr>${'<th>Dev. 1</th><th>Dev. 2</th><th>Compo.</th><th>Moy.</th>'.repeat(3)}</tr>`
    : `<tr><th>Matière</th><th>Dev. 1</th><th>Dev. 2</th><th>Compo.</th><th>Moy.</th><th>Coef.</th><th>Moy. × coef.</th><th>Appréciation</th></tr>`;
  const rk = r => r == null ? '–' : r + (r === 1 ? 'er' : 'e');
  const recap = annual ? `<h3 class="rt">Résultats par période</h3><table class="recap"><thead><tr><th></th><th>Moyenne générale</th><th>Rang</th><th>Moyenne de classe</th><th>Premier</th><th>Dernier</th><th>Mention</th></tr></thead><tbody>${
    ['1', '2', '3'].map(t => { const Rt = T[t], rt = Rt.rows.find(x => x.st.id === row.st.id); return `<tr><td class="l">Trimestre ${t}</td><td class="${rt.avg != null && rt.avg < 10 ? 'red' : ''}"><b>${fmt(rt.avg)}</b></td><td>${rk(rt.rank)} / ${Rt.rows.length}</td><td>${fmt(Rt.classAvg)}</td><td>${fmt(Rt.max)}</td><td>${fmt(Rt.min)}</td><td>${mention(rt.avg)}</td></tr>`; }).join('')
  }<tr class="total"><td class="l">Année complète</td><td class="${row.avg != null && row.avg < 10 ? 'red' : ''}">${fmt(row.avg)}</td><td>${rk(row.rank)} / ${R.rows.length}</td><td>${fmt(R.classAvg)}</td><td>${fmt(R.max)}</td><td>${fmt(R.min)}</td><td>${mention(row.avg)}</td></tr></tbody></table>`
  : `<div class="sum"><div><b class="${row.avg != null && row.avg < 10 ? 'red' : ''}">${fmt(row.avg)}</b>Moyenne générale</div><div><b>${rk(row.rank)}</b>Rang sur ${R.rows.length}</div><div><b>${fmt(R.classAvg)}</b>Moyenne de classe</div><div><b>${mention(row.avg) || '–'}</b>Mention</div></div>
    <div class="sum two"><div><b>${fmt(R.max)}</b>Moyenne du premier</div><div><b>${fmt(R.min)}</b>Moyenne du dernier</div></div>`;
  const comment = S.comments[row.st.id + '|' + ui.term] || '';

function startCooldown() {
  st.cool = 30; clearInterval(startCooldown.t);
  startCooldown.t = setInterval(() => { st.cool--; if (st.cool <= 0) { clearInterval(startCooldown.t); st.cool = 0; } const b = $('[data-act=resend]'); if (b) { b.disabled = st.cool > 0; b.textContent = st.cool > 0 ? `Renvoyer le code (${st.cool}s)` : 'Renvoyer le code'; } }, 1000);
}

/* ---------- Écrans d'état ---------- */
function showStatus(u, flash) {
  document.body.classList.add('locked'); const a = $('#auth'); a.hidden = false; fresh();
  const who = `<div class="k-who"><div class="ava">${esc(initial(u.name))}</div><div><b>${esc(u.name)}</b><small>${ic(u.method, 14)} ${esc(u.identifier)}</small></div></div>`;
  let body;
  if (u.status === 'rejected') body = `<div class="k-state bad">${ic('x', 34)}</div><h2>Accès non autorisé</h2><p class="k-lead">L’administrateur n’a pas validé votre souscription, ou a suspendu votre accès. Contactez-le pour en savoir plus.</p>`;
  else if (u.status === 'approved') body = `<div class="k-state ok">${ic('check', 38)}</div><h2>Souscription validée</h2><p class="k-lead">Bienvenue, ${esc(u.name)} ! Ouverture de votre espace…</p>`;
  else body = `<div class="k-state wait"><span class="k-pulse"></span>${ic('clock', 34)}</div><h2>${flash === 'new' ? 'Souscription envoyée' : 'En attente de validation'}</h2><p class="k-lead">L’administrateur doit valider votre accès. Vous recevrez une notification dès que ce sera fait. Cette page se met à jour automatiquement.</p>`;
  a.innerHTML = `<div class="k-card k-glass k-center">${who}${body}<div class="k-actions">${u.status === 'pending' ? '<button class="ghost" data-act="refresh" type="button">Actualiser</button>' : ''}<button class="ghost" data-act="logout" type="button">${ic('logout', 16)} Se déconnecter</button></div></div>`;
}

async function route(u, flash) {
  if (unsub) { unsub(); unsub = null; }
  if (!u) { cur = null; notifs = []; seen = new Set(); firstNotifLoad = true; if (window.KApp) KApp.stop(); renderUserBox(); showAuth(); return; }
  const was = cur && cur.id === u.id ? cur.status : null;
  cur = u;
  watch(u);
  if (u.status === 'approved') {
    if (was && was !== 'approved') { showStatus(u); await sleep(1500); }
    if (!cur || cur.status !== 'approved') return;
    await enter(u, flash);
  } else { if (window.KApp && was === 'approved') KApp.stop(); showStatus(u, flash); loadNotifs(); }
}
function watch(u) {
  unsub = API.subscribe(u.id, async () => {
    try {
      const f = await API.session();
      if (!f) return route(null);
      if (!cur || f.status !== cur.status || f.name !== cur.name) route(f); else loadNotifs();
    } catch {}
  });
}
async function enter(u, flash) {
  let cloud = null;
  if (REMOTE) { try { cloud = await API.cloudLoad(); } catch {} }
  let t; KApp.onSave = REMOTE ? d => { clearTimeout(t); t = setTimeout(() => API.cloudSave(d).catch(() => {}), 1200); } : null;
  KApp.start(u, cloud);
  hideAuth(); renderUserBox(); loadNotifs();
  if (flash === 'existing') KApp.toast('Vous aviez déjà un compte : connexion effectuée.');
}

/* ---------- Boîte utilisateur et notifications ---------- */
function renderUserBox() {
  const box = $('#userBox'); if (!box) return;
  if (!cur || cur.status !== 'approved') { box.innerHTML = ''; return; }
  const unread = notifs.filter(n => !n.read).length;
  box.innerHTML = `<div class="k-ubox"><div class="ava">${esc(initial(cur.name))}</div><div class="k-uinfo"><b>${esc(cur.name)}</b><small>${esc(cur.identifier)}</small></div>
    <button class="k-ibtn" data-act="bell" aria-label="Notifications${unread ? ` (${unread} non lues)` : ''}">${ic('bell', 20)}${unread ? `<span class="k-dot">${unread > 9 ? '9+' : unread}</span>` : ''}</button>
    <button class="k-ibtn" data-act="logout" aria-label="Se déconnecter" title="Se déconnecter">${ic('logout', 20)}</button></div>`;
}
async function loadNotifs() {
  if (!cur) return;
  try {
    const list = await API.notifs(); const fresh = list.filter(n => !seen.has(n.id) && !n.read);
    list.forEach(n => seen.add(n.id)); notifs = list;
    if (!firstNotifLoad) fresh.forEach(n => pushToast(n)); firstNotifLoad = false;
    renderUserBox(); if (!$('#notifPanel').hidden) renderNotifPanel();
  } catch {}
}
function pushToast(n) {
  const el = document.createElement('div'); el.className = 'k-ntoast'; el.innerHTML = `<div class="k-nico">${ic('bell', 18)}</div><div><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div>`;
  $('#ntoasts').appendChild(el); setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 6500);
}
function renderNotifPanel() {
  const p = $('#notifPanel');
  p.innerHTML = `<div class="k-nhead"><b>Notifications</b><button class="k-link" data-act="readall" type="button">Tout marquer comme lu</button></div>` +
    (notifs.length ? `<ul>${notifs.map(n => `<li class="${n.read ? '' : 'unread'}"><b>${esc(n.title)}</b><p>${esc(n.body)}</p><small>${fmtDate(n.at)}</small></li>`).join('')}</ul>` : '<p class="k-empty">Aucune notification.</p>');
}
async function toggleBell() {
  const p = $('#notifPanel'); p.hidden = !p.hidden;
  if (!p.hidden) { renderNotifPanel(); }
}
async function readAll() { await API.markRead(); notifs = notifs.map(n => ({ ...n, read: true })); renderUserBox(); renderNotifPanel(); }
async function logout() { try { await API.signOut(); } catch {} $('#notifPanel').hidden = true; st.step = 'form'; st.tab = 'login'; route(null); }

/* ---------- Espace administrateur ---------- */
const STATUS = { pending: ['En attente', ''], approved: ['Validé', 'ok'], rejected: ['Refusé', 'ko'] };
function openAdmin() {
  adm.open = true; $('#adminView').hidden = false; document.body.classList.add('k-noscroll'); touch(); renderAdmin();
  startAdminTimers();
}
function closeAdmin() { adm.open = false; $('#adminView').hidden = true; document.body.classList.remove('k-noscroll'); $('#adminFab').focus(); }
function lockAdmin(msg) {
  adm.pw = null; adm.users = []; clearInterval(adm.poll); adm.poll = null; updateFab();
  if (adm.open) renderAdmin(msg);
}
const touch = () => { adm.last = Date.now(); };
function startAdminTimers() {
  if (adm.idle) return;
  adm.idle = setInterval(() => { if (adm.pw && Date.now() - adm.last > ADMIN_IDLE_MS) lockAdmin('Session verrouillée après 5 minutes d’inactivité.'); }, 10000);
}
function updateFab() {
  const n = adm.pw ? adm.users.filter(u => u.status === 'pending').length : 0; const b = $('#fabBadge');
  b.hidden = !n; b.textContent = n > 9 ? '9+' : n; $('#adminFab').classList.toggle('k-has', !!n);
}
function renderAdmin(flash) {
  const body = $('#aBody'), lock = $('#aLock');
  if (!adm.pw) {
    lock.hidden = true;
    body.innerHTML = `<form class="k-gate" data-aform="gate" autocomplete="off"><div class="k-state lockic">${ic('lock', 32)}</div><h3>Accès protégé</h3><p class="k-lead">Seul l’administrateur peut ouvrir cet espace. Saisissez le mot de passe.</p>
      <label class="k-field"><span>Mot de passe administrateur</span><div class="k-in"><input name="pw" type="password" required autocomplete="current-password" spellcheck="false"><button type="button" class="k-eye" data-eye>Afficher</button></div></label>
      <div class="k-alert" id="gateAlert" role="alert" ${flash ? '' : 'hidden'}>${esc(flash || '')}</div>
      <button class="primary k-wide" type="submit">Déverrouiller</button></form>`;
    setTimeout(() => { const i = body.querySelector('input'); if (i) i.focus(); }, 60); return;
  }
  lock.hidden = false;
  const np = adm.users.filter(u => u.status === 'pending').length;
  body.innerHTML = `<div class="k-atabs" role="tablist">
      <button role="tab" data-adm="tab" data-t="req" aria-selected="${adm.tab === 'req'}">À valider${np ? ` <span class="k-cnt">${np}</span>` : ''}</button>
      <button role="tab" data-adm="tab" data-t="usr" aria-selected="${adm.tab === 'usr'}">Utilisateurs <span class="k-cnt soft">${adm.users.length}</span></button>
      <button role="tab" data-adm="tab" data-t="sec" aria-selected="${adm.tab === 'sec'}">Sécurité</button></div>
    <div class="k-abody" id="aContent">${adm.tab === 'sec' ? secHTML() : (adm.tab === 'usr' ? `<input class="k-search" type="search" placeholder="Rechercher un nom, un e-mail, un numéro…" value="${esc(adm.q)}" data-asearch aria-label="Rechercher"><div id="aList"></div>` : '<div id="aList"></div>')}</div>`;
  if (adm.tab !== 'sec') renderAdminList();
}
function urow(u, withDelete) {
  const [lab, cls] = STATUS[u.status] || ['', ''];
  const acts = u.status === 'pending' ? `<button class="primary mini" data-aact="approved">Valider</button><button class="danger mini" data-aact="rejected">Refuser</button>`
    : u.status === 'approved' ? `<button class="danger mini" data-aact="rejected">Révoquer</button>` : `<button class="primary mini" data-aact="approved">Valider</button>`;
  return `<div class="k-urow" data-id="${esc(u.id)}"><div class="ava sm">${esc(initial(u.name))}</div><div class="k-uinfo"><b>${esc(u.name)}</b><small>${ic(u.method, 14)} ${esc(u.identifier)} · ${fmtDate(u.createdAt)}</small></div>
    <span class="pill ${cls}">${lab}</span><div class="k-uact">${acts}${withDelete ? `<button class="ghost mini" data-aact="delete">Supprimer</button>` : ''}</div></div>`;
}
function renderAdminList() {
  const el = $('#aList'); if (!el) return;
  updateFab();
  if (adm.tab === 'req') {
    const l = adm.users.filter(u => u.status === 'pending');
    el.innerHTML = l.length ? l.map(u => urow(u, false)).join('') : `<div class="k-empty">${ic('check', 28)}<p>Aucune souscription en attente.</p></div>`;
  } else {
    const q = adm.q.trim().toLowerCase();
    const l = adm.users.filter(u => !q || (u.name + ' ' + u.identifier).toLowerCase().includes(q));
    el.innerHTML = l.length ? l.map(u => urow(u, true)).join('') : `<div class="k-empty"><p>Aucun utilisateur.</p></div>`;
  }
  const tabs = $('#aBody .k-atabs'); if (tabs) {
    const np = adm.users.filter(u => u.status === 'pending').length;
    tabs.children[0].innerHTML = `À valider${np ? ` <span class="k-cnt">${np}</span>` : ''}`;
    tabs.children[1].innerHTML = `Utilisateurs <span class="k-cnt soft">${adm.users.length}</span>`;
  }
}
function secHTML() {
  const log = API.adminLog();
  return `<form class="k-secform" data-aform="pw" autocomplete="off"><h3>Changer le mot de passe</h3>
    ${field('old', 'Mot de passe actuel', { type: 'password', ac: 'current-password', eye: true })}
    ${field('nw', 'Nouveau mot de passe', { type: 'password', ac: 'new-password', hint: '10 caractères min. : majuscule, minuscule, chiffre et symbole', eye: true })}
    <div class="k-meter" aria-hidden="true"><i></i><i></i><i></i><i></i><span></span></div>
    ${field('nw2', 'Confirmer le nouveau mot de passe', { type: 'password', ac: 'new-password' })}
    <div class="k-alert" id="pwAlert" role="alert" hidden></div>
    <button class="primary" type="submit">Enregistrer le nouveau mot de passe</button></form>
    <div class="k-secinfo"><h3>Protection</h3><ul><li>Verrouillage après 5 essais incorrects (15 min).</li><li>Verrouillage automatique après 5 min d’inactivité.</li><li>Le mot de passe n’est jamais enregistré en clair.</li></ul></div>
    ${log.length ? `<div class="k-secinfo"><h3>Journal</h3><ul class="k-log">${log.slice(0, 12).map(l => `<li><small>${fmtDate(l.at)}</small> ${esc(l.msg)}</li>`).join('')}</ul></div>` : ''}`;
}
async function loadUsers(silent) {
  if (!adm.pw) return;
  try { adm.users = await API.adminList(adm.pw); }
  catch (e) { if (e.code === 'invalid' || e.code === 'locked') return lockAdmin(e.message); if (!silent) KApp.toast(e.message); return; }
  if (adm.open && adm.pw) { if (adm.tab === 'sec') { updateFab(); } else renderAdminList(); } else updateFab();
}
async function adminGate(form, ev) {
  ev.preventDefault();
  const input = form.querySelector('input[name=pw]'), btn = form.querySelector('button[type=submit]'), al = $('#gateAlert');
  const pw = input.value; if (!pw) return;
  setBusy(btn, true); al.hidden = true;
  try {
    await API.adminLogin(pw); adm.pw = pw; adm.tab = 'req'; touch(); await loadUsers(true);
    clearInterval(adm.poll); adm.poll = setInterval(() => { if (adm.pw) loadUsers(true); }, REMOTE ? 15000 : 2500);
    renderAdmin();
  } catch (e) {
    setBusy(btn, false); input.value = ''; input.focus();
    al.textContent = e.message || 'Accès refusé.'; al.hidden = false; al.classList.remove('shake'); void al.offsetWidth; al.classList.add('shake');
  }
}
async function adminDecide(id, action, btn) {
  if (action === 'delete' && !confirm('Supprimer définitivement ce compte et ses données ?')) return;
  setBusy(btn, true);
  try {
    if (action === 'delete') await API.adminDelete(adm.pw, id); else await API.adminSetStatus(adm.pw, id, action);
    await loadUsers(true);
    KApp.toast(action === 'approved' ? 'Souscription validée. L’utilisateur est notifié.' : action === 'rejected' ? 'Accès refusé. L’utilisateur est notifié.' : 'Compte supprimé.');
  } catch (e) { setBusy(btn, false); if (e.code === 'invalid' || e.code === 'locked') lockAdmin(e.message); else KApp.toast(e.message); }
}
async function adminChangePw(form, ev) {
  ev.preventDefault();
  const v = n => form.querySelector(`[name=${n}]`).value, al = $('#pwAlert'), btn = form.querySelector('button[type=submit]');
  const fail = m => { al.textContent = m; al.hidden = false; al.classList.remove('shake'); void al.offsetWidth; al.classList.add('shake'); };
  al.hidden = true;
  if (!v('old')) return fail('Saisissez le mot de passe actuel.');
  if (!adminPwOk(v('nw'))) return fail('Nouveau mot de passe trop faible : 10 caractères min., avec majuscule, minuscule, chiffre et symbole.');
  if (v('nw') !== v('nw2')) return fail('La confirmation ne correspond pas.');
  if (v('nw') === v('old')) return fail('Le nouveau mot de passe doit être différent de l’ancien.');
  setBusy(btn, true);
  try { await API.adminChangePw(v('old'), v('nw')); adm.pw = v('nw'); touch(); setBusy(btn, false); form.reset(); KApp.toast('Mot de passe administrateur modifié.'); renderAdmin(); }
  catch (e) { setBusy(btn, false); fail(e.message || 'Échec de la modification.'); }
}

/* ---------- Événements ---------- */
function bind() {
  document.addEventListener('click', async e => {
    const t = e.target;
    const eye = t.closest('[data-eye]');
    if (eye) { const i = eye.parentElement.querySelector('input'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; eye.textContent = show ? 'Masquer' : 'Afficher'; return; }
    if (t.closest('#adminFab')) return openAdmin();
    const ad = t.closest('[data-adm]');
    if (ad) {
      touch(); const k = ad.dataset.adm;
      if (k === 'close') closeAdmin();
      else if (k === 'lock') lockAdmin();
      else if (k === 'tab') { adm.tab = ad.dataset.t; renderAdmin(); }
      return;
    }
    if (t.id === 'adminView') return closeAdmin();
    const aa = t.closest('[data-aact]');
    if (aa) { touch(); return adminDecide(aa.closest('.k-urow').dataset.id, aa.dataset.aact, aa); }
    const tab = t.closest('[data-tab]');
    if (tab && $('#auth').contains(tab)) { st.tab = tab.dataset.tab; st.step = 'form'; renderAuth(); return; }
    const mm = t.closest('[data-m]');
    if (mm && $('#auth').contains(mm)) { st.method = mm.dataset.m; st.step = 'form'; renderAuth(); return; }
    const act = t.closest('[data-act]');
    if (act) {
      const k = act.dataset.act;
      if (k === 'logout') return logout();
      if (k === 'bell') return toggleBell();
      if (k === 'readall') return readAll();
      if (k === 'refresh') { setBusy(act, true); try { const f = await API.session(); setBusy(act, false); if (f && f.status !== cur.status) route(f); else if (!f) route(null); else KApp.toast('Toujours en attente de validation.'); } catch { setBusy(act, false); } return; }
      if (k === 'oauth') { setBusy(act, true); try { sessionStorage.setItem('klasora-intent', st.tab); await API.oauth(METHODS[st.method].provider); } catch (er) { setBusy(act, false); authAlert(er.message); } return; }
      if (k === 'changephone') { st.step = 'form'; renderAuth(); return; }
      if (k === 'resend') { try { await API.sendOtp(st.phone); startCooldown(); KApp.toast('Nouveau code envoyé.'); renderAuth(); } catch (er) { authAlert(er.message); } return; }
    }
    if (!t.closest('#notifPanel')) $('#notifPanel').hidden = true;
  });
  document.addEventListener('submit', e => {
    const f = e.target;
    if (f.dataset.form) return onSubmit(f, e);
    if (f.dataset.aform === 'gate') return adminGate(f, e);
    if (f.dataset.aform === 'pw') return adminChangePw(f, e);
  });
  document.addEventListener('input', e => {
    const i = e.target; touch();
    if (i.dataset && i.dataset.asearch !== undefined) { adm.q = i.value; renderAdminList(); return; }
    const form = i.closest('form'); if (!form) return;
    if (form.dataset.form === 'otp' && i.name === 'code') { i.value = i.value.replace(/\D/g, '').slice(0, 6); if (i.value.length === 6) form.requestSubmit(); return; }
    if (form.dataset.form === 'signup' || form.dataset.form === 'login' || form.dataset.form === 'phone') {
      if (i.name === 'pw' && form.dataset.form === 'signup') { const m = form.querySelector('.k-meter'); const s = strength(i.value); m.dataset.s = s; m.querySelector('span').textContent = STRENGTH[s]; }
      clearTimeout(i._t); i._t = setTimeout(() => { if (form.dataset.form === 'login' && i.name === 'pw') return; validateField(form, i.name); if (i.name === 'pw' && form.dataset.form === 'signup' && form.querySelector('[name=pw2]').value) validateField(form, 'pw2'); }, 250);
      const al = $('#authAlert'); if (al) al.hidden = true;
    }
    if (form.dataset.aform === 'pw' && i.name === 'nw') { const m = form.querySelector('.k-meter'); const s = strength(i.value); m.dataset.s = s; m.querySelector('span').textContent = STRENGTH[s]; }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (adm.open) closeAdmin(); else $('#notifPanel').hidden = true; } touch(); });
}

/* ---------- Démarrage ---------- */
async function boot() {
  mountUI(); bind();
  const box = $('#userBox'); if (!box) { const s = $('.side-note'); if (s) s.insertAdjacentHTML('beforebegin', '<div id="userBox"></div>'); }
  try { if (REMOTE) await Remote.init(); }
  catch { document.body.classList.add('locked'); const a = $('#auth'); a.hidden = false; a.innerHTML = '<div class="k-card k-glass k-center"><div class="k-state bad">' + ic('x', 34) + '</div><h2>Connexion impossible</h2><p class="k-lead">Le service d’authentification est injoignable. Vérifiez votre connexion et rechargez la page.</p></div>'; return; }
  let u = null;
  try { u = await API.session(); } catch (e) { document.body.classList.add('locked'); const a = $('#auth'); a.hidden = false; a.innerHTML = `<div class="k-card k-glass k-center"><div class="k-state bad">${ic('x', 34)}</div><h2>Configuration incomplète</h2><p class="k-lead">${esc(e.message)}</p></div>`; return; }
  route(u, u ? intentFlash(u) : null);
}
window.KAuth = { _test: { Local, V, normId, normPhone, strength, adminPwOk, userPwOk, pbkdf2, ADMIN_DEFAULT } };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
